<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Ledger — study desk</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,620;0,9..144,700;1,9..144,500&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <div class="page">
      <header class="mast">
        <div>
          <p class="eyebrow">Study desk</p>
          <h1>Ledger</h1>
        </div>
        <div class="mast-meta">
          <time id="clock" datetime=""></time>
          <p id="board-name">Loading the board…</p>
        </div>
      </header>

      <div id="banner" class="banner" hidden></div>

      <section class="stage">
        <aside class="hours" aria-label="Study hours">
          <p class="eyebrow">Hours on this desk</p>
          <p class="hours-total" id="hours-total">0:00</p>
          <p class="hours-sub" id="hours-sub">No session yet today</p>
          <div class="hours-actions">
            <button type="button" id="timer-toggle" class="btn-ink">Start session</button>
            <button type="button" id="timer-reset" class="btn-ghost">Clear today</button>
          </div>
          <ol class="week" id="week" aria-label="This week"></ol>
          <p class="hours-note">
            Yeolpumta has no public API, so hours live here in this browser.
            Tasks come from Trello.
          </p>
        </aside>

        <div class="now-wrap">
          <div class="now-head">
            <p class="eyebrow" id="now-label">On the desk</p>
            <p class="now-count" id="now-count"></p>
          </div>
          <div id="now" class="now-stack"></div>
        </div>
      </section>

      <section class="board" aria-label="The rest of the board">
        <div id="columns" class="columns"></div>
      </section>

      <footer class="colophon">
        <p id="sync">Waiting for Trello…</p>
        <button type="button" id="refresh" class="btn-ghost">Refresh</button>
      </footer>
    </div>
    <script src="/app.js" defer></script>
  </body>
</html>
